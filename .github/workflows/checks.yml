name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # New vulnerabilities appear without any change in this repository.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r requirements.txt pytest==9.2.0 ruff==0.17.0 pip-audit==2.10.1
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        if: ${{ !cancelled() }}
        run: ruff format --check .
      - name: Tests
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. pytest tests
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the stack as non-root, with a read-only filesystem, and scan files
        run: bash tests/integration.sh

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan files
        run: |
          docker run --rm -v "$PWD":/src:ro "$TRIVY_IMAGE" fs --exit-code 1 \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL /src
      - name: Scan the service image
        if: ${{ !cancelled() }}
        run: |
          docker build -t antivirus-service:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL antivirus-service:ci
      - name: Scan the ClamAV image used in the Kubernetes example
        if: ${{ !cancelled() }}
        run: |
          clamav_image=$(grep -o 'clamav/clamav:[^ ]*' k8s-example.yaml.tpl)
          docker pull "$clamav_image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL "$clamav_image"
      - name: Scan the Kubernetes example
        if: ${{ !cancelled() }}
        run: |
          # Trivy skips .tpl files, so this renders the example first.
          mkdir rendered
          # shellcheck disable=SC2016
          sed -e 's/\${NAMESPACE}/default/' -e 's/\${ANTIVIRUS_SERVICE_IMAGE}/antivirus-service:ci/' \
            k8s-example.yaml.tpl > rendered/antivirus.yaml
          docker run --rm -v "$PWD/rendered":/src:ro "$TRIVY_IMAGE" config --exit-code 1 \
            --severity HIGH,CRITICAL /src

  code-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        run: docker run --rm -v "$PWD":/src:ro "$GITLEAKS_IMAGE" dir /src --no-banner
      - name: Semgrep
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics off --error \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag .
