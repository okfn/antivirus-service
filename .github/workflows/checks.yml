name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # New vulnerabilities appear without any change in this repository.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # Pinned by digest: a tag can be repointed to a different image.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r requirements.txt pytest==9.2.0 ruff==0.17.0 pip-audit==2.10.1
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        if: ${{ !cancelled() }}
        run: ruff format --check .
      - name: Tests
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. pytest tests
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan files
        run: |
          docker run --rm -v "$PWD":/src:ro "$TRIVY_IMAGE" fs --exit-code 1 \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL /src
      - name: Scan the service image
        if: ${{ !cancelled() }}
        run: |
          docker build -t antivirus-service:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL antivirus-service:ci
      - name: Scan the ClamAV image used in the Kubernetes example
        if: ${{ !cancelled() }}
        run: |
          clamav_image=$(grep -o 'clamav/clamav:[^ ]*' k8s-example.yaml.tpl)
          docker pull "$clamav_image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL "$clamav_image"
      - name: Scan the Kubernetes example
        if: ${{ !cancelled() }}
        run: |
          # Trivy skips .tpl files, so this renders the example first.
          mkdir rendered
          sed -e 's/${NAMESPACE}/default/' -e 's/${ANTIVIRUS_SERVICE_IMAGE}/antivirus-service:ci/' \
            k8s-example.yaml.tpl > rendered/antivirus.yaml
          docker run --rm -v "$PWD/rendered":/src:ro "$TRIVY_IMAGE" config --exit-code 1 \
            --severity HIGH,CRITICAL /src

  code-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gitleaks
        run: docker run --rm -v "$PWD":/src:ro "$GITLEAKS_IMAGE" dir /src --no-banner
      - name: Semgrep
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics off --error .
